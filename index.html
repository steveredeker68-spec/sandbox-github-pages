<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Daylight — local weather</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --surface: #fff;
      --ink: #17243b;
      --muted: #78859a;
      --line: #edf0f5;
      --blue: #477ef2;
      --blue-soft: #edf3ff;
      --shadow: 0 18px 55px rgb(34 54 89 / 8%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #101725;
        --surface: #192334;
        --ink: #edf3ff;
        --muted: #9ba9bd;
        --line: #29364a;
        --blue: #8eb0ff;
        --blue-soft: #24334e;
        --shadow: 0 18px 55px rgb(0 0 0 / 22%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 46px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(221 233 255 / 54%), transparent 42%),
        var(--page);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(ellipse at 50% 0%, #1d2b43, transparent 48%), var(--page); }
    }

    .app { width: min(100%, 440px); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 27px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 750; letter-spacing: -.5px; }
    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffc96a, #ff9a67);
      box-shadow: 0 5px 14px rgb(255 172 92 / 30%);
      font-size: 19px;
    }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 7px 6px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 5px 22px rgb(34 54 89 / 4%);
    }
    .search svg { flex: 0 0 auto; color: var(--muted); }
    .search input {
      width: 100%;
      min-width: 0;
      padding: 8px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    .search input::placeholder { color: var(--muted); }
    .search button {
      flex: 0 0 auto;
      padding: 9px 16px;
      border: 0;
      border-radius: 11px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .15s, filter .15s;
    }
    .search button:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .search button:focus-visible, .search input:focus-visible { outline: 3px solid rgb(71 126 242 / 35%); outline-offset: 3px; }
    .search button:disabled { cursor: wait; opacity: .7; }

    .place-row { display: flex; align-items: center; justify-content: space-between; margin: 26px 2px 12px; }
    .place { margin: 0; font-size: 21px; font-weight: 730; letter-spacing: -.6px; }
    .date { margin-top: 2px; color: var(--muted); font-size: 13px; }
    .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .live::before { width: 7px; height: 7px; border-radius: 50%; background: #38c78b; content: ""; }
    .live.fallback::before { background: #f5aa45; }

    .current {
      position: relative;
      overflow: hidden;
      min-height: 234px;
      padding: 24px 25px;
      border: 1px solid rgb(255 255 255 / 55%);
      border-radius: 24px;
      background: linear-gradient(125deg, #7ea8ff 0%, #7194f5 50%, #927ce5 100%);
      box-shadow: 0 16px 34px rgb(89 118 218 / 22%);
      color: #fff;
    }
    .current::before, .current::after {
      position: absolute;
      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .current::before { width: 235px; height: 235px; top: -98px; right: -59px; }
    .current::after { width: 185px; height: 185px; top: -72px; right: -33px; }
    .current-top { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; }
    .current-label { color: rgb(255 255 255 / 81%); font-size: 13px; font-weight: 560; }
    .weather-symbol { margin: -4px 3px 0 0; font-size: 67px; line-height: 1; filter: drop-shadow(0 5px 8px rgb(50 53 130 / 13%)); }
    .temperature { position: relative; z-index: 1; margin: 3px 0 0; font-size: 70px; font-weight: 720; letter-spacing: -5px; line-height: 1; }
    .temperature span { margin-left: 2px; font-size: 34px; font-weight: 500; vertical-align: 23px; letter-spacing: -1px; }
    .condition { position: relative; z-index: 1; margin: 8px 0 0; color: rgb(255 255 255 / 91%); font-size: 15px; font-weight: 550; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 15px; padding: 15px 3px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 7px 20px rgb(34 54 89 / 3%); }
    .stat { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat-icon { font-size: 19px; }
    .stat-label { color: var(--muted); font-size: 11px; }
    .stat-value { margin-top: 1px; font-size: 13px; font-weight: 680; }

    .forecast-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 27px 2px 12px; }
    .forecast-heading h2 { margin: 0; font-size: 16px; font-weight: 720; letter-spacing: -.2px; }
    .forecast-heading span { color: var(--muted); font-size: 12px; }
    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .day {
      display: flex;
      min-height: 135px;
      flex-direction: column;
      align-items: center;
      padding: 12px 4px 11px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 5px 16px rgb(34 54 89 / 3%);
    }
    .day-name { color: var(--muted); font-size: 11px; font-weight: 650; }
    .day-icon { margin: 8px 0; font-size: 24px; line-height: 1; }
    .day-high { font-size: 14px; font-weight: 700; }
    .day-low { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .footer { margin-top: 21px; color: var(--muted); font-size: 11px; text-align: center; }
    .message { min-height: 19px; margin: 8px 2px 0; color: #d26c54; font-size: 12px; }

    @media (max-width: 380px) {
      body { padding: 28px 14px; }
      .current { min-height: 218px; padding: 21px; }
      .forecast { gap: 5px; }
      .day { min-height: 128px; }
      .stat { gap: 6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">☀</span> daylight</div>
      <span class="eyebrow">Your weather, at a glance</span>
    </header>

    <form class="search" id="search-form" role="search">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"></circle>
        <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
      </svg>
      <input id="city-input" type="search" value="Orlando" placeholder="Search a city…" aria-label="Search a city" autocomplete="off">
      <button id="search-button" type="submit">Search</button>
    </form>

    <section aria-label="Current weather">
      <div class="place-row">
        <div>
          <h1 class="place" id="city-name">Orlando, FL</h1>
          <div class="date" id="today-date"></div>
        </div>
        <span class="live" id="live-status">Live weather</span>
      </div>

      <div class="current">
        <div class="current-top">
          <div class="current-label">Right now</div>
          <div class="weather-symbol" id="current-icon" aria-hidden="true">☀️</div>
        </div>
        <p class="temperature"><span id="current-temp">82</span><span>°</span></p>
        <p class="condition" id="current-condition">Mostly sunny</p>
      </div>

      <div class="stats">
        <div class="stat"><span class="stat-icon" aria-hidden="true">🌡️</span><div><div class="stat-label">Feels like</div><div class="stat-value" id="feels-like">84°</div></div></div>
        <div class="stat"><span class="stat-icon" aria-hidden="true">💧</span><div><div class="stat-label">Humidity</div><div class="stat-value" id="humidity">62%</div></div></div>
        <div class="stat"><span class="stat-icon" aria-hidden="true">🍃</span><div><div class="stat-label">Wind</div><div class="stat-value" id="wind">7 mph</div></div></div>
      </div>
    </section>

    <section aria-labelledby="forecast-title">
      <div class="forecast-heading">
        <h2 id="forecast-title">5-day forecast</h2>
        <span>Coming up</span>
      </div>
      <div class="forecast" id="forecast"></div>
    </section>
    <p class="message" id="message" role="status" aria-live="polite"></p>
    <footer class="footer">Weather data by Open-Meteo</footer>
  </main>

  <script>
    const FALLBACK = {
      city: "Orlando, FL",
      current: { temperature_2m: 82, apparent_temperature: 84, relative_humidity_2m: 62, wind_speed_10m: 7, weather_code: 1 },
      daily: {
        time: ["2026-11-10", "2026-11-11", "2026-11-12", "2026-11-13", "2026-11-14"],
        weather_code: [1, 2, 3, 61, 0],
        temperature_2m_max: [84, 82, 79, 76, 81],
        temperature_2m_min: [68, 67, 65, 64, 66]
      }
    };

    const weather = (code) => {
      if (code === 0) return { text: "Clear sky", icon: "☀️" };
      if (code === 1) return { text: "Mostly sunny", icon: "🌤️" };
      if (code === 2) return { text: "Partly cloudy", icon: "⛅" };
      if (code === 3) return { text: "Overcast", icon: "☁️" };
      if ([45, 48].includes(code)) return { text: "Foggy", icon: "🌫️" };
      if ([51, 53, 55, 56, 57].includes(code)) return { text: "Drizzle", icon: "🌦️" };
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: "Rain showers", icon: "🌧️" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: "Snow", icon: "🌨️" };
      if ([95, 96, 99].includes(code)) return { text: "Thunderstorms", icon: "⛈️" };
      return { text: "Partly cloudy", icon: "⛅" };
    };

    const rounded = (number) => Math.round(number);
    const fahrenheit = (celsius) => rounded(celsius * 9 / 5 + 32);
    const formatDay = (isoDate, options) => new Date(`${isoDate}T12:00:00`).toLocaleDateString(undefined, options);

    function render(data, isFallback) {
      document.getElementById("city-name").textContent = data.city;
      const current = data.current;
      const currentWeather = weather(current.weather_code);
      document.getElementById("current-temp").textContent = rounded(current.temperature_2m);
      document.getElementById("current-condition").textContent = currentWeather.text;
      document.getElementById("current-icon").textContent = currentWeather.icon;
      document.getElementById("feels-like").textContent = `${rounded(current.apparent_temperature)}°`;
      document.getElementById("humidity").textContent = `${rounded(current.relative_humidity_2m)}%`;
      document.getElementById("wind").textContent = `${rounded(current.wind_speed_10m)} mph`;

      document.getElementById("forecast").innerHTML = data.daily.time.slice(0, 5).map((date, index) => {
        const conditions = weather(data.daily.weather_code[index]);
        const day = index === 0 ? "Today" : formatDay(date, { weekday: "short" });
        return `<article class="day" aria-label="${formatDay(date, { weekday: "long", month: "long", day: "numeric" })}: ${conditions.text}, high ${rounded(data.daily.temperature_2m_max[index])} degrees, low ${rounded(data.daily.temperature_2m_min[index])} degrees">
          <span class="day-name">${day}</span><span class="day-icon" aria-hidden="true">${conditions.icon}</span>
          <span class="day-high">${rounded(data.daily.temperature_2m_max[index])}°</span><span class="day-low">${rounded(data.daily.temperature_2m_min[index])}°</span>
        </article>`;
      }).join("");

      const status = document.getElementById("live-status");
      status.textContent = isFallback ? "Sample forecast" : "Live weather";
      status.classList.toggle("fallback", isFallback);
    }

    async function fetchWeather(city) {
      const geoUrl = new URL("https://geocoding-api.open-meteo.com/v1/search");
      geoUrl.search = new URLSearchParams({ name: city, count: "1", language: "en", format: "json" });
      const geoResponse = await fetch(geoUrl);
      if (!geoResponse.ok) throw new Error("City search is unavailable.");
      const location = (await geoResponse.json()).results?.[0];
      if (!location) throw new Error(`Couldn't find “${city}”. Try another city.`);

      const forecastUrl = new URL("https://api.open-meteo.com/v1/forecast");
      forecastUrl.search = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        temperature_unit: "fahrenheit",
        wind_speed_unit: "mph",
        timezone: "auto",
        forecast_days: "5"
      });
      const response = await fetch(forecastUrl);
      if (!response.ok) throw new Error("Weather data is temporarily unavailable.");
      const result = await response.json();
      const region = location.admin1 ? `, ${location.admin1}` : "";
      return {
        city: `${location.name}${region}`,
        current: result.current,
        daily: result.daily
      };
    }

    async function search(city) {
      const button = document.getElementById("search-button");
      const message = document.getElementById("message");
      button.disabled = true;
      message.textContent = "";
      try {
        const data = await fetchWeather(city);
        render(data, false);
      } catch (error) {
        if (city.trim().toLowerCase() === "orlando") {
          render(FALLBACK, true);
        } else {
          document.getElementById("live-status").textContent = "Sample forecast";
          document.getElementById("live-status").classList.add("fallback");
          render({ ...FALLBACK, city }, true);
        }
        message.textContent = error.message || "Couldn't load the latest forecast. Showing sample weather.";
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("today-date").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });
    document.getElementById("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const city = document.getElementById("city-input").value.trim();
      if (city) search(city);
    });

    render(FALLBACK, true);
    search("Orlando");
  </script>
</body>
</html>
